name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Coverly-Windows-installer
          path: dist/*.exe

  # Основная сборка: Android 7.0+ (целевой Android 16, подходит для Google Play)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Generate Android icons
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - name: Background playback and widget patch (experimental)
        run: bash android-bg/apply.sh
        continue-on-error: true
      - name: Start.io ads
        run: bash android-bg/startio.sh
      - run: npx cap sync android
      - name: Build debug APK
        id: build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        continue-on-error: true
      - name: Retry without experimental patch
        if: steps.build.outcome == 'failure'
        run: |
          bash android-bg/revert.sh
          bash android-bg/startio.sh
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Coverly-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare signing key
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты подписи не заданы: релизный .aab не собран (см. README, раздел про подпись)."
          fi
      - name: Build signed release (.aab and .apk)
        if: steps.sign.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME=$(node -p "require('./package.json').version")
          bash android-bg/signing.sh
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - name: Upload .aab for Google Play
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Coverly-Android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed release APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Coverly-Android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # Для старых телефонов: Android 5.1 и 6.0 (без рекламы, не для Google Play, ставится вручную)
  android-legacy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Use Capacitor 6 (supports Android 5.1+)
        run: npm install --no-save @capacitor/core@6.2.3 @capacitor/android@6.2.3 @capacitor/cli@6.2.3
      - run: npx cap add android
      - name: Background playback and widget patch (experimental)
        run: bash android-bg/apply.sh
        continue-on-error: true
      - run: npx cap sync android
      - name: Build debug APK
        id: build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        continue-on-error: true
      - name: Retry without experimental patch
        if: steps.build.outcome == 'failure'
        run: |
          bash android-bg/revert.sh
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Coverly-Android-legacy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Публикация релиза: сайт на Vercel берёт ссылки на последние файлы отсюда
  release:
    needs: [windows-exe, android, android-legacy]
    if: always() && needs.windows-exe.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Coverly-Windows-installer
          path: dl/win
      - uses: actions/download-artifact@v4
        with:
          name: Coverly-Android-debug-apk
          path: dl/apk-debug
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Coverly-Android-release-apk
          path: dl/apk-release
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Coverly-Android-legacy-apk
          path: dl/apk-legacy
      - name: Prepare files with stable names
        id: prep
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp dl/win/*.exe "out/Coverly-Setup-$V.exe"
          if [ -f dl/apk-release/app-release.apk ]; then cp dl/apk-release/app-release.apk "out/Coverly-$V.apk"; else cp dl/apk-debug/app-debug.apk "out/Coverly-$V.apk"; fi
          if [ -f dl/apk-legacy/app-debug.apk ]; then cp dl/apk-legacy/app-debug.apk "out/Coverly-$V-legacy.apk"; fi
          ls -la out
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}.${{ github.run_number }}
          name: Coverly ${{ steps.prep.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: out/*
